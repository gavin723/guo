name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  alpha-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate dashboard and invariants
        run: npm run check
      - name: Validate LEAN algorithm syntax
        run: python -m py_compile quant-engine/AlphaRadarAlgorithm.py
